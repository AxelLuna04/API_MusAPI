_spring.application.name=api-musapi
# Puerto del servidor
server.port=8080

# Variables locales (contrasenas y claves). Copia .env.example como .env y llena los valores.
spring.config.import=optional:file:.env[.properties]

grpc.server.port=9090
grpc.server.security.auth.enabled=false  


# Configuraci\u00f3n para SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MusAPI_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=musapi_user
spring.datasource.password=${DB_PASSWORD}

# Configuraci\u00f3n JPA/Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# Configuracion para envio de corrreos
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hunterstrophy01@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Tama\u00f1o m\u00e1ximo para archivos multipart (por defecto suele ser 1MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

#Clave
jwt.secret=${JWT_SECRET}

spring.profiles.active=test



